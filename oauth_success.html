<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Complete - Mirenku</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 2rem;
        }
        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .message {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }
        .close-hint {
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
    <script>
        // Auto-close after 3 seconds
        setTimeout(function() {
            window.close();
            // Fallback message if window.close() doesn't work
            setTimeout(function() {
                document.querySelector('.close-hint').innerHTML = 'You can now close this window.';
            }, 500);
        }, 3000);
    </script>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Authorization Successful!</h1>
        <p class="message">You have successfully connected Mirenku to MyAnimeList.</p>
        <p class="close-hint">This window will close automatically...</p>
    </div>
</body>
</html>
