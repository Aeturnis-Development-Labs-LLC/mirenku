name: Cross-Platform Tests - The Mirenku Way

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Quick verification that it works on all platforms
  quick-check:
    name: Quick Check - ${{ matrix.os }} / Py${{ matrix.python-version }}
    strategy:
      fail-fast: false  # See all results
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.11']  # Min and max only for speed

    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Verify core functionality
      run: |
        # Can the app even start?
        python -c "import sys; sys.path.insert(0, 'src'); from models.database import Database; db = Database(':memory:'); db.initialize(); print('✓ Database works on ${{ matrix.os }}')"

        # Can users do basic operations?
        python -c "
import sys
sys.path.insert(0, 'src')
from models.database import Database
from services.anime_service import AnimeService

db = Database(':memory:')
db.initialize()
service = AnimeService(db)

# Basic user operation
anime_id = service.add_anime('Test Anime', status='Watching')
anime = service.get_anime(anime_id)
print(f'✓ Basic operations work on ${{ matrix.os }} with Python ${{ matrix.python-version }}')
"

    - name: Run minimal tests
      run: |
        # Just the absolute essentials
        pytest tests/test_database.py tests/test_config.py -v --tb=short --maxfail=3

    - name: Platform-specific checks
      run: |
        # Test platform-specific features work
        python -c "
import sys
import platform
sys.path.insert(0, 'src')

system = platform.system()
print(f'✓ Running on {system}')

# Test config paths work on this platform
from utils.config import Config
config = Config()
db_path = config.get_db_path()
print(f'✓ Config paths work: {db_path}')

# Test that tkinter is available (but don't create windows)
import tkinter
print('✓ Tkinter available')
"

    - name: Summary
      if: always()
      run: |
        echo "==================================="
        echo "Platform: ${{ matrix.os }}"
        echo "Python: ${{ matrix.python-version }}"
        echo "Status: ${{ job.status }}"
        echo "==================================="
        echo "This is source-available software."
        echo "Core functionality has been verified."
        echo "==================================="