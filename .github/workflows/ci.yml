name: CI/CD Pipeline - The Mirenku Way

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ==========================================
  # CRITICAL: Must pass for builds to proceed
  # ==========================================
  smoke-tests:
    name: Smoke Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true  # Stop immediately if core functionality is broken
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run smoke tests
        run: |
          # Test core functionality that users depend on
          python -c "import sys; sys.path.insert(0, 'src'); from models.database import Database; db = Database(':memory:'); db.initialize(); print('✓ Database works')"
          python -c "import sys; sys.path.insert(0, 'src'); from services.anime_service import AnimeService; print('✓ Core service imports')"
          python -c "import sys; sys.path.insert(0, 'src'); from utils.config import Config; c = Config(); print('✓ Config system works')"
          pytest tests/test_database.py -v --tb=short
          pytest tests/test_config.py -v --tb=short

      - name: Security scan
        run: |
          pip install bandit
          bandit -r src -ll -i B101,B601 -f json -o bandit-report.json || true
          python -c "import json; data=json.load(open('bandit-report.json')); exit(1 if any(r['issue_severity']=='HIGH' for r in data.get('results',[])) else 0)"

  # ==========================================
  # INFORMATIONAL: Quality checks (non-blocking)
  # ==========================================
  quality-checks:
    name: Quality Checks (Informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Don't block releases for code style

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy pytest pytest-cov

      - name: Code formatting check
        run: |
          echo "=== Checking code style (informational) ==="
          ruff check src tests --output-format=github || echo "⚠️ Style issues found (non-blocking)"
          black --check src tests || echo "⚠️ Formatting issues found (non-blocking)"

      - name: Type checking
        run: |
          echo "=== Type checking (informational) ==="
          mypy src --ignore-missing-imports || echo "⚠️ Type issues found (non-blocking)"

      - name: Test coverage report
        run: |
          echo "=== Running full test suite (informational) ==="
          pytest tests/ -v --cov=src --cov-report=term-missing \
            -m "not gui" \
            --ignore=tests/test_first_run_dialog.py \
            --ignore=tests/test_mal_auth_dialog.py || echo "⚠️ Some tests failed (non-blocking)"

  # ==========================================
  # USER-FACING: Test actual user workflows
  # ==========================================
  user-workflows:
    name: User Workflow Tests
    needs: [smoke-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: true  # Informational but important
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.11']  # Min and max supported

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test user workflows
        run: |
          echo "=== Testing real user scenarios ==="
          # Test that a user can add anime
          python -c "
import sys
sys.path.insert(0, 'src')
from models.database import Database
from services.anime_service import AnimeService

db = Database(':memory:')
db.initialize()
service = AnimeService(db)

# User adds an anime
anime_id = service.add_anime('Attack on Titan', status='Watching', episodes_watched=5)
print(f'✓ User can add anime: {anime_id}')

# User updates progress
service.increment_episode(anime_id)
anime = service.get_anime(anime_id)
assert anime.episodes_watched == 6
print('✓ User can track progress')

# User completes anime
service.update_anime(anime_id, status='Completed')
anime = service.get_anime(anime_id)
assert anime.status == 'Completed'
print('✓ User can complete anime')
"

  # ==========================================
  # BUILD: Create executables for users
  # ==========================================
  build:
    name: Build Executable - ${{ matrix.os }}
    needs: [smoke-tests]  # Only needs core functionality working
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: mirenku-linux
            binary_name: mirenku
          - os: windows-latest
            artifact_name: mirenku-windows.exe
            binary_name: mirenku.exe
          - os: macos-latest
            artifact_name: mirenku-macos
            binary_name: mirenku

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller mirenku.spec

      - name: Test executable starts
        run: |
          echo "=== Verifying executable can start ==="
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Windows: Just check it exists
            test -f dist/${{ matrix.binary_name }}
          else
            # Unix: Check it's executable
            test -x dist/${{ matrix.binary_name }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}

  # ==========================================
  # RELEASE: Ship to users
  # ==========================================
  release:
    name: Create Release
    needs: [build, user-workflows]  # User workflows are informational
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Mirenku ${{ github.ref_name }} - The Mirenku Way

            Built with love for anime fans! 🎌

            ### Downloads
            - [Windows](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mirenku-windows.exe)
            - [Linux](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mirenku-linux)
            - [macOS](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mirenku-macos)

            ### Installation
            See [README](https://github.com/${{ github.repository }}#installation) for installation instructions.

            ### Note
            This is source-available software. While we test core functionality,
            your experience may vary. Please report issues to help improve Mirenku!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # OPTIONAL: Additional quality gates
  # ==========================================
  docker:
    name: Docker Image (Optional)
    needs: [smoke-tests]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mirenku:latest
            ${{ secrets.DOCKER_USERNAME }}/mirenku:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max